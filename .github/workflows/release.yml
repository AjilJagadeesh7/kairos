name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kairos ${{ github.ref_name }}'
          releaseBody: |
            See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Wait for the desktop job so the draft release exists; still run if a
    # single desktop leg failed (the APK shouldn't depend on e.g. macOS).
    needs: release
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'  # Capacitor 7 android compiles with source/target 21
      - name: Install frontend dependencies
        run: npm ci
      - name: Derive version from git tag
        id: ver
        run: |
          # Tag looks like "v0.1.5"; strip the leading "v" → versionName "0.1.5".
          NAME="${GITHUB_REF_NAME#v}"
          # versionCode must be a single increasing integer for Android/Play.
          # Pack MAJOR.MINOR.PATCH → MAJOR*1000000 + MINOR*1000 + PATCH
          # (allows up to 999 for minor and patch; bump the multipliers if needed).
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          CODE=$(( ${MAJOR:-0} * 1000000 + ${MINOR:-0} * 1000 + ${PATCH:-0} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$NAME versionCode=$CODE"
      - name: Build web assets & sync Capacitor
        run: npm run build:mobile
      - name: Build mobile OTA bundle
        # Zips the just-built dist/ into kairos-mobile-<ver>.zip and writes
        # mobile-latest.json, which the app polls for self-hosted OTA updates.
        # minNative is read from package.json "otaMinNative" by the script.
        env:
          OTA_VERSION: ${{ steps.ver.outputs.name }}
          OTA_REPO: ${{ github.repository }}
        run: node scripts/build-mobile-bundle.mjs
      - name: Build APK + AAB
        env:
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Decode the keystore from repo secrets and let Gradle sign both the
            # APK (sideload) and the AAB (Play Console) via signingConfigs.
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            export ANDROID_KEYSTORE_PATH="$PWD/release.keystore"
            ./gradlew assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "Kairos-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "Kairos-${GITHUB_REF_NAME}.aab"
          else
            # No keystore configured — ship a debug-signed APK (sideloadable only).
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "Kairos-${GITHUB_REF_NAME}.apk"
          fi
      - name: Attach Android artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android
          # The .aab only exists for signed release builds; glob picks up what's there.
          ARTIFACTS=( Kairos-"${GITHUB_REF_NAME}".apk )
          [ -f "Kairos-${GITHUB_REF_NAME}.aab" ] && ARTIFACTS+=( "Kairos-${GITHUB_REF_NAME}.aab" )
          # Self-hosted OTA assets (web bundle + manifest) live at repo root.
          OTA_ZIP="../mobile-bundle/kairos-mobile-${GITHUB_REF_NAME#v}.zip"
          if [ -f "$OTA_ZIP" ]; then
            ARTIFACTS+=( "$OTA_ZIP" "../mobile-bundle/mobile-latest.json" )
          fi
          gh release upload "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY" \
          || gh release create "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
            --draft --title "Kairos $GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"