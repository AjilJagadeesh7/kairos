apply plugin: 'com.android.application'

android {
    namespace "com.kairos.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kairos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version is injected from the git tag in CI (see .github/workflows/release.yml).
        // Falls back to these values for local/dev builds when the env vars are absent.
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1001").toInteger()
        versionName = System.getenv("ANDROID_VERSION_NAME") ?: "0.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is driven by env vars in CI (see release.yml). When the
    // keystore env var is absent (local/dev), no signingConfig is attached and
    // `assembleRelease` falls back to debug signing so local builds still work.
    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    // Kairos Lite (CI-built, the existing app id) and Kairos Full ("Pro": on-device model,
    // built locally with `npm run build:full:android`, never by CI). Separate app ids so
    // both can be listed on Play.
    flavorDimensions "edition"
    productFlavors {
        lite {
            dimension "edition"
        }
        full {
            dimension "edition"
            applicationIdSuffix ".pro"
            versionNameSuffix "-pro"
            // The on-device runtime ships for arm64 only (PRD).
            ndk { abiFilters 'arm64-v8a' }
        }
    }
    // llama.cpp is built only when a Full task runs, so Lite builds (and CI) never need the NDK.
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('full') }) {
        ndkVersion "27.2.12479018"
        externalNativeBuild {
            cmake {
                path "src/full/cpp/CMakeLists.txt"
                version "3.22.1"
            }
        }
        defaultConfig {
            externalNativeBuild {
                cmake {
                    // Fetch and unpack llama.cpp outside the project: editors and virus scanners
                    // watching the project can lock the folder mid-extract on Windows. Also a cache.
                    arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                              "-DFETCHCONTENT_BASE_DIR=${System.getProperty('user.home').replace('\\', '/')}/.cache/kairos-llama.cpp"
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
