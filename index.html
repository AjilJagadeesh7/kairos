<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kairos</title>
    <script>
      (function () {
        var t = localStorage.getItem('kairos.theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);

        // Keep in sync with THEME_REGISTRY isDark in src/themes/registry.ts —
        // themed palettes ship light and dark variants, so this can't just be
        // "anything that isn't 'light'".
        var darkThemes = [
          'dark', 'dracula', 'nord', 'catppuccin', 'cyberpunk',
          'amethyst-dark', 'bubblegum-dark', 'caffeine-dark',
          'doom64-dark', 'brutalism-dark', 'arcade-dark',
        ];
        if (darkThemes.indexOf(t) !== -1) document.documentElement.classList.add('dark');

        // Apply background immediately so the native window never shows a white
        // flash before the CSS stylesheet is parsed and applied.
        var bg = {
          light:       '#F8F6F2',
          dark:        '#0A0A0A',
          cyberpunk:   '#020108',
          dracula:     '#1E1F2D',
          nord:        '#262C38',
          catppuccin:  '#11111B',
          'amethyst-light':  '#F7F4FB',
          'amethyst-dark':   '#16121C',
          'bubblegum-light': '#F6E6EE',
          'bubblegum-dark':  '#12242E',
          'caffeine-light':  '#F6F1E9',
          'caffeine-dark':   '#16110D',
          'doom64-light':    '#F2E9DF',
          'doom64-dark':     '#0C0806',
          'brutalism-light': '#FFFFFF',
          'brutalism-dark':  '#000000',
          'arcade-light':    '#FFF6E5',
          'arcade-dark':     '#0B0A1F',
        };
        var col = bg[t] || bg.light;
        document.documentElement.style.background = col;
        document.body && (document.body.style.background = col);

        var f = localStorage.getItem('kairos.font');
        var fw = localStorage.getItem('kairos.fontWeight');
        var fs = localStorage.getItem('kairos.fontSize');
        var sizes = { small: '14px', default: '16px', large: '18px', xlarge: '20px' };
        if (fs && sizes[fs]) document.documentElement.style.setProperty('--app-font-size', sizes[fs]);
        var fonts = {
          manrope: "'Manrope',ui-sans-serif,system-ui,sans-serif",
          inter: "'Inter',ui-sans-serif,system-ui,sans-serif",
          roboto: "'Roboto',ui-sans-serif,system-ui,sans-serif",
          ubuntu: "'Ubuntu',ui-sans-serif,system-ui,sans-serif",
          poppins: "'Poppins',ui-sans-serif,system-ui,sans-serif",
          lora: "'Lora',ui-serif,Georgia,serif",
          'libre-baskerville': "'Libre Baskerville',ui-serif,Georgia,serif",
          'playfair-display': "'Playfair Display',ui-serif,Georgia,serif",
          cormorant: "'Cormorant Garamond',ui-serif,Georgia,serif",
          cinzel: "'Cinzel',ui-serif,serif",
        };
        if (f && fonts[f]) document.documentElement.style.setProperty('--font-sans', fonts[f]);
        if (fw) document.documentElement.style.setProperty('--font-weight', fw === 'light' ? '300' : fw === 'medium' ? '500' : '400');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
